{#
  Apply the saved preference before the stylesheet is painted. This is kept
  deliberately small because React is not available on legacy pages; the
  React app (utils/theme.ts) takes over from here, including the animated
  transition. Preferences: "light", "dark" or "system" (the default).
#}
<script>
  (() => {
    const storageKey = "listenbrainz-theme";
    const root = document.documentElement;
    const darkQuery = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    const readPreference = () => {
      try {
        const stored = localStorage.getItem(storageKey);
        return stored === "light" || stored === "dark" ? stored : "system";
      } catch (_) {
        return "system";
      }
    };
    const applyPreference = (preference) => {
      const theme = preference === "system"
        ? (darkQuery && darkQuery.matches ? "dark" : "light")
        : preference;
      root.dataset.bsTheme = theme;
      root.style.colorScheme = theme;
    };
    const preferences = ["light", "dark", "system"];
    const capitalize = (preference) =>
      preference.charAt(0).toUpperCase() + preference.slice(1);
    const nextPreference = (preference) =>
      preferences[(preferences.indexOf(preference) + 1) % preferences.length];
    const updateLegacyToggle = () => {
      const preference = readPreference();
      const hint = `Click to switch to ${capitalize(nextPreference(preference))} mode`;
      // This marker distinguishes the server-rendered toggle from the React one.
      const toggle = document.querySelector("[data-legacy-theme-toggle]");
      if (!toggle) return;
      toggle.setAttribute("aria-label", `Theme: ${capitalize(preference)}. ${hint}`);
      toggle.setAttribute("title", hint);
      toggle.querySelectorAll("[data-theme-icon]").forEach((icon) => {
        icon.toggleAttribute("hidden", icon.dataset.themeIcon !== preference);
      });
    };

    applyPreference(readPreference());

    // Used by the legacy (Jinja) navigation only.
    window.ListenBrainzTheme = {
      set: (preference) => {
        const next = preferences.includes(preference) ? preference : "system";
        try { localStorage.setItem(storageKey, next); } catch (_) {}
        applyPreference(next);
        updateLegacyToggle();
        window.dispatchEvent(new Event("listenbrainzthemechange"));
      },
      cycle: () => window.ListenBrainzTheme.set(nextPreference(readPreference())),
    };

    document.addEventListener("DOMContentLoaded", () => {
      // React pages follow OS changes themselves (with the reveal animation).
      if (!document.querySelector("[data-legacy-theme-toggle]")) return;
      updateLegacyToggle();
      if (darkQuery) {
        darkQuery.addEventListener("change", () => {
          if (readPreference() === "system") window.ListenBrainzTheme.set("system");
        });
      }
    }, { once: true });
  })();
</script>
