{%- macro render_lp_image(x, y, width, height, transform, image) -%}
  {%- if image.entity_mbid -%}
  <a href="https://listenbrainz.org/release/{{ image.entity_mbid }}" target="_blank">
  {%- endif -%}
    <image
        x="{{ x }}"
        y="{{ y }}"
        width="{{ width }}"
        height="{{ height }}"
        preserveAspectRatio="xMidYMid slice"
        href="{{ image.url }}"
        transform="{{ transform }}"
    >
        {%- if image.title and image.artist -%}
        <title>
          {{- image.title|escape ~ " - " ~ image.artist|escape -}}
        </title>
        {%- endif -%}
    </image>
  {%- if image.entity_mbid -%}
  </a>
  {%- endif -%}
{%- endmacro -%}
<svg version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     width="{{ width }}" height="{{ height }}"
     viewBox="0 0 {{ width }} {{ height }}"
     preserveAspectRatio="xMinYMin meet"
>
    <title>Top 5 releases {{ metadata["time_range"] }} for {{ metadata["user_name"] }}&#xA;</title>
    <desc>
        {%- for release in releases[:5] -%}
            {{- loop.index -}}. {{ release.release_name }} - {{ release.artist_name }}&#xA;
        {%- endfor -%}
    </desc>
    <style>
        .background-image {
            pointer-events: none;
        }
    </style>
    <defs>
        <filter id="colorizePlayer">
            <feColorMatrix type="matrix" values="0 0 0 {{ player_color_r }} 0
                                                 0 0 0 {{ player_color_g }} 0
                                                 0 0 0 {{ player_color_b }} 0
                                                 0 0 0 1 0" />
        </filter>
    </defs>

    <!-- Layer 1: Album Art -->
    {% if scene == "close" %}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.08000,-0.63000,0.24000,2.54000,-56.000,300.000)", images[1]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(1.31000,-0.66000,0.68000,1.37000,231.000,-101.000)", images[2]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(1.95000,1.10000,-1.17000,2.08000,-14.000,682.000)", images[3]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.11000,0.57000,-0.32000,0.95000,580.000,-61.000)", images[4]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(1.30000,0.62000,-1.12000,2.56000,991.000,737.000)", images[5]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.37000,-0.59000,0.87000,2.68000,671.000,542.000)", images[6]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.47000,0.36000,-0.49000,2.12000,364.000,19.000)", images[7]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(7.34000,-0.49000,0.57000,7.31000,82.000,172.000)", images[0]) }}
    {% elif scene == "vinyl" %}
        {{ render_lp_image(0, 0, 100, 100, "matrix(3.30000,1.15000,-1.10000,3.10000,537.000,-26.000)", images[1]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(3.19000,-1.40000,1.52000,3.14000,129.000,321.000)", images[3]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(3.44530,0.83540,-0.79460,3.46460,202.460,423.000)", images[0]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.56340,2.56990,-2.50010,2.54660,130.840,446.180)", images[2]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.65000,2.31000,-2.16000,2.67000,674.000,260.000)", images[4]) }}
    {% elif scene == "many" %}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.42000,-0.48000,0.47000,2.54000,-72.000,-8.000)", images[0]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.64000,-0.96000,1.10000,2.72000,671.000,277.000)", images[2]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.49000,-0.04000,0.18000,2.87000,870.000,-34.000)", images[1]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(1.97000,-1.90000,1.71000,1.67000,525.000,80.000)", images[3]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.58000,1.68000,-1.28000,2.12000,71.000,843.000)", images[4]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(1.72000,1.42000,-1.34000,1.67000,967.000,381.000)", images[5]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(1.67000,0.16000,-0.54000,1.65000,1014.000,639.000)", images[6]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(1.92000,-0.66000,0.81000,2.75000,-186.000,315.000)", images[7]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(3.01000,-0.09000,0.12000,2.98000,9.000,537.000)", images[8]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.19000,-1.99000,1.96990,2.20000,306.010,752.000)", images[10]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.86000,-0.60000,0.65000,2.80000,385.000,351.000)", images[9]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.86990,0.05000,-0.05010,2.44010,718.000,754.000)", images[11]) }}
    {% else %}
        {# wood — rotate around image center to align with sleeve overlays #}
        {{ render_lp_image(89, 318, 195, 195, "rotate(6.1,186,415)", images[2]) }}
        {{ render_lp_image(17, 223, 193, 193, "rotate(-22.4,113,319)", images[1]) }}
        {{ render_lp_image(189, 240, 189, 189, "rotate(-4,283,334)", images[0]) }}
        {{ render_lp_image(404, 480, 198, 198, "rotate(-11.9,503,579)", images[4]) }}
        {{ render_lp_image(385, 488, 202, 203, "rotate(2.2,486,589)", images[3]) }}
    {% endif %}

    <!-- Layer 2: Scene Background -->
    <image x="0" y="0" width="1000" height="1000" href="{{ bg_url }}" class="background-image" />

    <!-- Layer 3: Wear & Tear -->
    {% if worn_url %}
    <image x="0" y="0" width="1000" height="1000" href="{{ worn_url }}" class="background-image" />
    {% endif %}

    <!-- Layer 4: Record Player Color Overlay -->
    <image x="0" y="0" width="1000" height="1000" href="{{ player_color_url }}"
           filter="url(#colorizePlayer)" style="mix-blend-mode: multiply;" class="background-image" />
</svg>
