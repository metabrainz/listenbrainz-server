{%- macro render_lp_image(x, y, width, height, transform, image) -%}
  {%- if image.entity_mbid -%}
  <a href="https://listenbrainz.org/release/{{ image.entity_mbid }}" target="_blank">
  {%- endif -%}
    <image
        x="{{ x }}"
        y="{{ y }}"
        width="{{ width }}"
        height="{{ height }}"
        preserveAspectRatio="xMidYMid slice"
        href="{{ image.url }}"
        transform="{{ transform }}"
    >
        {%- if image.title and image.artist -%}
        <title>
          {{- image.title|escape ~ " - " ~ image.artist|escape -}}
        </title>
        {%- endif -%}
    </image>
  {%- if image.entity_mbid -%}
  </a>
  {%- endif -%}
{%- endmacro -%}
<svg version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     width="{{ width }}" height="{{ height }}"
     viewBox="0 0 1000 1000"
     preserveAspectRatio="xMinYMin meet"
>
    <title>Top 5 releases {{ metadata["time_range"] }} for {{ metadata["user_name"] }}&#xA;</title>
    <desc>
        {%- for release in releases[:5] -%}
            {{- loop.index -}}. {{ release.release_name }} - {{ release.artist_name }}&#xA;
        {%- endfor -%}
    </desc>
    <style>
        .background-image {
            pointer-events: none;
        }
    </style>
    <defs>
        <filter id="colorizePlayer">
            <feColorMatrix type="matrix" values="0 0 0 {{ player_color_r }} 0
                                                 0 0 0 {{ player_color_g }} 0
                                                 0 0 0 {{ player_color_b }} 0
                                                 0 0 0 1 0" />
        </filter>
    </defs>

    <!-- Layer 1: Album Art -->
    {% if scene == "close" %}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.14948,-0.65105,0.25018,2.64779,-60.12446,294.16943)", images[1]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(1.32965,-0.66990,0.69020,1.39055,229.50750,-101.53250)", images[2]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(1.97925,1.11650,-1.39837,2.48597,-13.11400,677.00000)", images[3]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.18027,0.58898,-0.33757,1.00216,577.36515,-64.55695)", images[4]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(1.35560,0.64652,-1.15283,2.63505,989.86143,731.92174)", images[5]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.40060,-0.76680,0.87793,2.74828,670.28700,552.14200)", images[6]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.54663,0.37117,-0.50636,2.19077,360.98630,14.90292)", images[7]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(7.44495,-0.47464,0.55387,7.43644,75.87977,166.91620)", images[0]) }}
    {% elif scene == "vinyl" %}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.68975,2.34465,-2.19240,2.71005,673.63250,256.26500)", images[4]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(3.23785,-1.42100,1.54280,3.18710,125.46750,319.69500)", images[3]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(3.34950,1.16725,-1.12653,3.17476,535.35000,-29.18750)", images[1]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(3.49698,0.84793,-0.80652,3.51657,200.47198,419.77500)", images[0]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.65657,2.50531,-2.55423,2.68208,128.18360,441.81880)", images[2]) }}
    {% elif scene == "many" %}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.91295,0.05075,-0.05168,2.51669,715.96726,748.13327)", images[11]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.45630,-0.48720,0.48069,2.59777,-74.16750,-9.54500)", images[0]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.67960,-0.97440,1.11650,2.76080,668.19500,275.68000)", images[2]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.01395,-1.94238,1.73565,1.69505,520.80044,81.56091)", images[3]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.52735,-0.04060,0.18395,2.93301,867.99750,-36.12250)", images[1]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.61870,1.70520,-1.30954,2.16892,71.05874,838.43787)", images[4]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.28360,1.88020,-1.79490,2.35120,1007.32000,313.01000)", images[5]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.34719,0.86064,-0.72160,2.39359,1010.15984,635.94053)", images[6]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(3.07514,-0.09195,0.12260,3.04468,6.65250,534.83250)", images[8]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(1.96771,-0.67640,0.82215,2.79125,-188.04750,313.43250)", images[7]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.23765,-2.03330,1.99945,2.23300,301.40989,753.18751)", images[10]) }}
        {{ render_lp_image(0, 0, 100, 100, "matrix(2.92247,-0.61311,0.67332,2.90045,379.73172,346.83835)", images[9]) }}
    {% else %}
        {# wood — original production placement, designed for a 750-unit canvas: rotate about the origin, then scale to the 1000-unit canvas #}
        {{ render_lp_image(89, 318, 195, 195, "scale(1.333333) rotate(6.1)", images[2]) }}
        {{ render_lp_image(17, 223, 193, 193, "scale(1.333333) rotate(-22.4)", images[1]) }}
        {{ render_lp_image(189, 240, 189, 189, "scale(1.333333) rotate(-4)", images[0]) }}
        {{ render_lp_image(404, 480, 198, 198, "scale(1.333333) rotate(-11.9)", images[4]) }}
        {{ render_lp_image(385, 488, 202, 203, "scale(1.333333) rotate(2.2)", images[3]) }}
    {% endif %}

    <!-- Layer 2: Scene Background -->
    <image x="0" y="0" width="1000" height="1000" href="{{ bg_url }}" class="background-image" />

    <!-- Layer 3: Wear & Tear -->
    {% if worn_url %}
    <image x="0" y="0" width="1000" height="1000" href="{{ worn_url }}" class="background-image" />
    {% endif %}

    <!-- Layer 4: Record Player Color Overlay -->
    {# The wood player-colour overlay was exported at a different scale and offset than the wood photo, so place it explicitly. #}
    {% set pc = (312.68, -64.15, 705.3) if scene == "wood" else (0, 0, 1000) %}
    <image x="{{ pc[0] }}" y="{{ pc[1] }}" width="{{ pc[2] }}" height="{{ pc[2] }}" href="{{ player_color_url }}"
           filter="url(#colorizePlayer)" style="mix-blend-mode: multiply;" class="background-image" />
</svg>
