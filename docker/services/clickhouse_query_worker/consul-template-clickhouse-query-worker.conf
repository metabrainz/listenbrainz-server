template {
    source = "/code/listenbrainz/consul_config.py.ctmpl"
    destination = "/code/listenbrainz/listenbrainz/config.py"
}

exec {
    command = ["run-lb-command", "python3", "-m", "listenbrainz.clickhouse.query_worker"]
    splay = "5s"
    # Keep running jobs alive; restart manually to apply config changes.
    reload_signal = "SIGCONT"
    kill_signal = "SIGTERM"
    kill_timeout = "30s"
}
